let currentLang='es',annualBilling=false;
function money(v,lang){return new Intl.NumberFormat(lang==='en'?'en-GB':lang==='fr'?'fr-FR':lang==='ca'?'ca-ES':'es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2}).format(v)}
function renderPlans(){
  const d=t[currentLang];
  document.getElementById('plansGrid').innerHTML=d.plans.map(p=>{
    const normalAnnual=p.price*12;
    const discountedAnnual=normalAnnual*.9;
    const displayPrice=annualBilling?discountedAnnual:p.price;
    const period=annualBilling?d.annual_per:d.per;
    const note=annualBilling?`<strong>${d.normal_price}</strong> <s>${money(normalAnnual,currentLang)}</s>`:'';
    return `<article class="plan ${p.featured?'featured':''}">${p.badge?`<div class="badge">${p.badge}</div>`:''}<h3>${p.name}</h3><div class="desc">${p.desc}</div><div><span class="price">${money(displayPrice,currentLang)}</span> <span class="per">${period}</span></div>${note?`<div class="annual-note">${note}</div>`:''}<div class="freq">${p.freq}</div><ul>${p.items.map(i=>`<li>${i}</li>`).join('')}</ul><a class="btn" href="#contact">${p.button}</a></article>`
  }).join('');
  document.getElementById('billingSwitch').classList.toggle('annual',annualBilling);
  document.getElementById('monthlyLabel').classList.toggle('active',!annualBilling);
  document.getElementById('annualLabel').classList.toggle('active',annualBilling);
}
function apply(lang){
  currentLang=lang;document.documentElement.lang=lang;document.title=t[lang].page;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(t[lang][k]!==undefined)el.textContent=t[lang][k]});
  document.getElementById('planSelect').innerHTML=t[lang].options.map(o=>`<option>${o}</option>`).join('');
  document.getElementById('phoneCountry').innerHTML=t[lang].countries.map(c=>`<option value="${c[1]}">${c[0]}${c[1] ? ' ('+c[1]+')' : ''}</option>`).join('');
  document.getElementById('quickGrid').innerHTML=t[lang].quick.map(q=>`<div class="quickitem"><h3>${q[0]}</h3><p>${q[1]}</p></div>`).join('');
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));renderPlans();
}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>apply(b.dataset.lang));
document.getElementById('billingSwitch').onclick=()=>{annualBilling=!annualBilling;renderPlans()};
apply('es');
</script></body></html>
