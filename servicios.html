te de la gestión de reparaciones o reformas.','70 €','por visita'],['Compra de bienvenida','Compramos lo básico para que lo encuentres al llegar. En Solo llaves cuesta 50 €. En Esencial y Confianza cuesta 35 € si se coordina con una visita programada; si requiere un desplazamiento aparte, son 50 €. El coste de la compra se cobra aparte.','desde 35 €','+ coste de la compra'],['Entrega o recogida de llaves adicional','Todas las tarifas incluyen 1 entrega y 1 recogida al año. Si necesitas más, entregamos o recogemos llaves a una persona autorizada de 08:00 a 22:00.','35 €','por entrega o recogida adicional · 50 € fuera de horario']]}}
