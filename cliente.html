<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F3EC"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Clau24 — Área de cliente</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#F7F3EC;--deep:#E7EEE9;--card:#FFFDF9;--ink:#24343A;--navy:#1F6B5C;--orange:#C84B31;--line:rgba(36,52,58,.13);--ok:#2E8B72;--warn:#B7663D}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--navy);color:#F7F3EC;padding:28px 22px;display:flex;flex-direction:column}.brand{font:600 24px 'Fraunces',serif;margin-bottom:38px}.side a{color:rgba(247,243,236,.8);text-decoration:none;padding:11px 12px;border-radius:12px;margin:3px 0}.side a.active,.side a:hover{background:rgba(255,255,255,.08);color:#fff}.side .back{margin-top:auto;font-size:13px}.main{padding:36px 42px}.top{display:flex;justify-content:space-between;gap:20px;align-items:start}.top h1{font:500 38px 'Fraunces',serif;margin:0 0 8px;color:var(--navy)}.muted{color:rgba(36,52,58,.66)}.status{background:rgba(46,106,85,.1);color:var(--ok);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 10px 26px rgba(31,107,92,.04)}h2{font:500 24px 'Fraunces',serif;color:var(--navy);margin:0 0 16px}.hero-card{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.big{font:500 32px 'Fraunces',serif;color:var(--navy)}.btn{display:inline-block;background:var(--orange);color:white;text-decoration:none;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.tag{font-size:12px;padding:5px 9px;border-radius:999px;background:#E7EEE9}.warn{color:var(--warn)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.reports{display:grid;gap:12px}.report{background:white;border:1px solid var(--line);border-radius:16px;padding:17px}.report strong{display:block;color:var(--navy);margin-bottom:4px}.report a{color:var(--orange);font-size:13px;font-weight:600;text-decoration:none}.extras{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.extra{border:1px solid var(--line);background:white;border-radius:16px;padding:16px}.extra b{display:block;margin-bottom:5px;color:var(--navy)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:24px}.grid{grid-template-columns:1fr}.extras{grid-template-columns:1fr}}.langs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}.langs button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#F7F3EC;border-radius:999px;padding:6px 8px;font-size:10px;cursor:pointer}.langs button.active{background:#F7F3EC;color:#1F6B5C}
